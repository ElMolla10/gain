<!doctype html>
<html><head><meta charset="utf-8"><style>

@font-face { font-family: "PlexAr"; src: url("../../apps/mobile/assets/fonts/IBMPlexSansArabic_700Bold.ttf"); font-weight: 700; }
html,body { margin:0; width:1024px; height:500px; background:#10120E; overflow:hidden; }
