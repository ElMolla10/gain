name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Engine + mobile (the mobile DB-layer tests use Node's built-in SQLite, no device needed).
      - run: npm run typecheck
      - run: npm test
