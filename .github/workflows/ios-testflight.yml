# Manual TestFlight build. workflow_dispatch only: a push or pull_request
# trigger would let a fork, or an ordinary merge, start an App Store upload.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      skip_submit:
        description: Build the IPA and skip the App Store Connect / TestFlight upload
        type: boolean
        default: false

# upload-artifact needs actions: write. Nothing else in this job writes to the repo.
permissions:
  contents: read
  actions: write

# One store build at a time. A second run waits so two jobs cannot both
# auto-increment the remote build number and upload.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 180
    environment: app-store
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
      # CocoaPods fails on ASCII-8BIT when the locale is unset.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm workspaces, lockfile at the repo root. eas.json's node version is ignored for --local.
      - run: npm ci

      - name: Install EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check EAS CLI
        run: eas --version

      # macos-26 already has both. Install only when a future image drops them.
      # CocoaPods uses the same Homebrew package as scripts/ios-setup.sh.
      - name: Ensure fastlane and CocoaPods
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          if ! command -v fastlane >/dev/null 2>&1; then
            brew install fastlane
          fi
          echo "CocoaPods $(pod --version)"
          fastlane --version

      # Image 20260824 ships Xcode 26.0.1–26.6; 26.6 is the default. SDK 57 needs
      # 26.4 or newer. 26.4.1 is the 26.4 release on that image. Do not select
      # Xcode 27: the iOS 27 SDK needs scene lifecycle, which this profile does not enable.
      - name: Select Xcode 26.4.1
        run: |
          set -euo pipefail
          xcode_app="/Applications/Xcode_26.4.1.app"
          if [ ! -d "$xcode_app" ]; then
            echo "Expected ${xcode_app} on the macos-26 image." >&2
            echo "Installed Xcode apps:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          sudo xcodebuild -license accept
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          xv="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          major="${xv%%.*}"
          rest="${xv#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 26 ] || { [ "$major" -eq 26 ] && [ "$minor" -lt 4 ]; }; then
            echo "Xcode ${xv} is older than 26.4 (Expo SDK 57)." >&2
            exit 1
          fi
          if [ "$major" -ge 27 ]; then
            echo "Xcode ${xv} is 27 or newer. This profile does not enable the iOS 27 scene lifecycle." >&2
            exit 1
          fi

      # EAS reads EXPO_ASC_API_KEY_PATH, EXPO_ASC_KEY_ID, and EXPO_ASC_ISSUER_ID.
      # The .p8 is a secret, so it is written here and the path is exported.
      # EXPO_APPLE_TEAM_ID is required once those three are set: non-interactive
      # credential validation prompts for the team id otherwise.
      # https://docs.expo.dev/build/building-on-ci/
      - name: Write the App Store Connect API key
        env:
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing app-store environment secret: EXPO_TOKEN" >&2
            missing=1
          fi
          if [ -z "${EXPO_ASC_API_KEY_P8}" ]; then
            echo "Missing app-store environment secret: EXPO_ASC_API_KEY_P8" >&2
            missing=1
          fi
          if [ -z "${EXPO_ASC_KEY_ID}" ]; then
            echo "Missing app-store environment secret: EXPO_ASC_KEY_ID" >&2
            missing=1
          fi
          if [ -z "${EXPO_ASC_ISSUER_ID}" ]; then
            echo "Missing app-store environment secret: EXPO_ASC_ISSUER_ID" >&2
            missing=1
          fi
          if [ -z "${EXPO_APPLE_TEAM_ID}" ]; then
            echo "Missing app-store environment secret: EXPO_APPLE_TEAM_ID" >&2
            missing=1
          fi
          case "${EXPO_APPLE_TEAM_TYPE}" in
            "" | INDIVIDUAL | COMPANY_OR_ORGANIZATION | IN_HOUSE) ;;
            *)
              echo "EXPO_APPLE_TEAM_TYPE must be INDIVIDUAL, COMPANY_OR_ORGANIZATION, or IN_HOUSE." >&2
              missing=1
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ.get("EXPO_ASC_API_KEY_P8", "")
          text = raw.replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN PRIVATE KEY" not in text and "\\n" in text:
              text = text.replace("\\n", "\n")
          if "BEGIN PRIVATE KEY" not in text:
              try:
                  decoded = base64.b64decode("".join(text.split()), validate=True)
              except Exception:
                  sys.exit(
                      "EXPO_ASC_API_KEY_P8 is neither a PEM private key nor base64 of one. "
                      "Paste the .p8 (including BEGIN PRIVATE KEY) or its base64."
                  )
              text = decoded.decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN PRIVATE KEY" not in text or "END PRIVATE KEY" not in text:
              sys.exit("EXPO_ASC_API_KEY_P8 did not contain an App Store Connect .p8 private key.")
          if not text.endswith("\n"):
              text += "\n"
          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{os.environ['EXPO_ASC_KEY_ID']}.p8"
          dest.write_text(text)
          dest.chmod(0o600)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"EXPO_ASC_API_KEY_PATH={dest}\n")
          print("Wrote the App Store Connect API key for EXPO_ASC_API_KEY_PATH.")
          PY
          eas whoami

      - name: Verify TestFlight inventory and internal group
        run: node scripts/testflight-verify.cjs preflight

      # Remote credentials (distribution cert + provisioning profile) are downloaded
      # with EXPO_TOKEN. appVersionSource remote + autoIncrement on the extended
      # production profile sets the build number. Do not export GAIN_IOS_BUILD_NUMBER.
      - name: Build the iOS app locally
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build
          eas build -p ios --profile testflight-live --local --non-interactive --output build/gain.ipa
          test -s build/gain.ipa

      - name: Verify signed IPA versions
        run: python3 scripts/verify-testflight-ipa.py

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: gain-ios
          path: apps/mobile/build/gain.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Submit to App Store Connect
        if: ${{ !inputs.skip_submit }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          eas submit -p ios --profile testflight-live --path build/gain.ipa --non-interactive

      - name: Verify Apple processing and Team (Expo) availability
        if: ${{ !inputs.skip_submit }}
        run: node scripts/testflight-verify.cjs verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-verification
          path: apps/mobile/build/*verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the API key file
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8
          if [ -n "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            rm -f "${EXPO_ASC_API_KEY_PATH}"
          fi
